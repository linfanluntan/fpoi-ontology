name: Validate FPOI artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python validation/check_artifact_stats.py
      - run: python validation/run_competency_queries.py
      - run: python validation/run_pyshacl_validation.py
